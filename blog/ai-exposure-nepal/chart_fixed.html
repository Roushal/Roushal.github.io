    [[r[0],'code'],[r[1],''],[r[3].toFixed(1),'n'],[r[4].toFixed(1),'n']].forEach(([v,c]) => { const td = document.createElement('td'); td.textContent = v; if (c) td.className = c; tr.appendChild(td); });
    tb.appendChild(tr); });
  t.appendChild(tb); p.appendChild(t);
  paint(g);
}
