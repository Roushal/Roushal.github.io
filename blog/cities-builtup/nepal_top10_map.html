        var e=G.ents[c.k];

        // Per-year anchor in pixels
        var ax=G.X(D.lon0+c.a[0]*D.dlon);
        var ay=G.Y(D.lat0+c.a[1]*D.dlat);

        var left=pl.sg<0;

        h+='<g class="c" data-i="'+i+'"><path d="'+G.px[year][i]+'" fill="'+INK+'" shape-rendering="crispEdges"/>'
            +'<path class="ld" d="'+leaderD(ax,ay,pl)+'" fill="none" stroke="'+INK+'" stroke-opacity=".8" stroke-width=".7" stroke-linejoin="miter"/>'
            +'<g class="lb" tabindex="0"><rect x="'+f(pl.x0-2*G.u)+'" y="'+f(pl.y0)+'" width="'+f(e.w+4*G.u)+'" height="'+f(2*G.lh)+'" fill="transparent"/>'
            +'<text x="'+f(left?pl.x1:pl.x0)+'" y="'+f(pl.ly)+'" text-anchor="'+(left?"end":"start")+'" dominant-baseline="central" font-size="'+f(G.fs)
            +'" font-weight="'+(c.rk<=3?700:500)+'">'+esc(c.n)+'</text></g></g>';

    });


    svg.setAttribute("viewBox","0 0 "+G.W+" "+G.H);
    svg.setAttribute("width",G.W);
    svg.setAttribute("height",G.H);
    svg.setAttribute("class","");
    svg.innerHTML=h;


    [].forEach.call(svg.querySelectorAll(".c"),function(g){

        var i=+g.dataset.i;
        var lb=g.querySelector(".lb");

        function on(){

            svg.setAttribute("class","hov");
            g.setAttribute("class","c on");

            show(i);
        }

        function off(){

            svg.setAttribute("class","");
            g.setAttribute("class","c");

            tip.style.opacity=0;
        }

        lb.addEventListener("pointerenter",on);
        lb.addEventListener("pointerleave",off);
        lb.addEventListener("focus",on);
        lb.addEventListener("blur",off);

    });
}


// ---------- tooltip ----------------------------------------------------------------------------------

function show(i){

    var c=D.data[year][i];
    var pl=G.placed[c.k];

    // Unicode escapes prevent character-encoding problems
    tip.innerHTML='<b>'+esc(c.f)+'</b><br>'
        +fmt(c.km2)+' km\u00b2 built-up<br>'
        +'Rank '+c.rk+' of '+D.data[year].length+' \u00b7 '+year;

    var w=tip.offsetWidth;
    var hgt=tip.offsetHeight;
    var cx=(pl.x0+pl.x1)/2;

    var top=pl.y0-hgt-6*G.u;

    if(top<0)
        top=pl.y1+6*G.u;

    tip.style.left=Math.max(0,Math.min(G.W-w,cx-w/2))+"px";
    tip.style.top=top+"px";
    tip.style.opacity=1;
}


// ---------- responsive boot --------------------------------------------------------------------------

function boot(){

    build();
    render();
}

sync();
boot();

if(window.ResizeObserver){

    new ResizeObserver(function(){

        if(root.clientWidth>0&&Math.round(root.clientWidth)!==lastW)
            boot();

    }).observe(root);
}

})();
</script>
</div>
