<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#775496">
$if(description_attr)$
  <meta name="description" content="$description_attr$">
  <meta property="og:description" content="$description_attr$">
$endif$
  <meta property="og:title" content="$title_attr$">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/atom+xml" title="Raushal Shrestha" href="../../feed.xml">
  <link rel="stylesheet" href="../../style.css">
$for(css)$
  <link rel="stylesheet" href="$css$">
$endfor$
  <title>$title_attr$ · Raushal Shrestha</title>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header>
    <a class="name" href="../../index.html">Raushal Shrestha</a>
    <nav aria-label="Main">
      <ul>
        <li><a href="../index.html" aria-current="true">Blog</a></li>
        <li><a href="../../research/index.html">Research</a></li>
        <li><a href="../../cv/index.html">CV</a></li>
        <li><a href="../../resources/index.html">Resources</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <h1>$title$</h1>
    <p class="subtitle">$description$</p>


$body$

    <dl class="info">
      <dt>Published</dt>
      <dd>$date_human$</dd>
      <dt>Updated</dt>
      <dd>$updated_human$</dd>
      <dt>Slug</dt>
      <dd>/blog/$slug$/</dd>
    </dl>
  </main>

  <footer>
    <p>© 2026 Raushal Shrestha</p>
    <p><a href="../this-website/index.html">Colophon</a></p>
    <p><a href="../../feed.xml">Feed</a></p>
  </footer>
</body>
</html>
